name: Generate Schematic PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'eagle/*.sch'
      - 'eagle/Makefile'
      - '.github/workflows/schematic-pdf.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git rev-parse

    - name: Set version vars
      run: |
        echo "PDF_FILE=TF0060DCA_$(git rev-parse --short HEAD)_$(date +%Y_%m_%d).pdf" >> $GITHUB_ENV

    - name: Generate PDF schematic
      uses: addnab/docker-run-action@v3
      with:
        image: terriblefire78/eagle-pdf
        options: -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }}/eagle
        run: |
          python /app/generate_schematic_pdf.py TF0060DCA.sch "${{ env.PDF_FILE }}"

    - name: Upload PDF as artifact
      uses: actions/upload-artifact@v4
      with:
        name: schematic-pdf
        path: eagle/${{ env.PDF_FILE }}
        retention-days: 90

    - name: Release PDF (on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: eagle/${{ env.PDF_FILE }}
