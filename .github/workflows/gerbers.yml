name: Generate Gerbers

on:
  push:
    branches: [ main ]
    paths:
      - 'eagle/*.brd'
      - 'eagle/*.cam'
      - 'eagle/Makefile'
      - '.github/workflows/gerbers.yml'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gerbers:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git rev-parse

    - name: Set version vars
      run: |
        echo "GERBER_DIR=TF0060DCA_$(git rev-parse --short HEAD)_$(date +%Y_%m_%d)" >> $GITHUB_ENV

    - name: Generate Gerber files
      uses: addnab/docker-run-action@v3
      with:
        image: terriblefire78/eagle:v1
        options: -v ${{ github.workspace }}:${{ github.workspace }} -w ${{ github.workspace }}/eagle
        run: |
          mkdir -p "${{ env.GERBER_DIR }}"
          eagle -X -dCAMJOB -jjlcpcb_4_layer_v9.cam -o"${{ env.GERBER_DIR }}" TF0060DCA.brd

    - name: Upload Gerber files as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.GERBER_DIR }}
        path: eagle/${{ env.GERBER_DIR }}
        retention-days: 90

    - name: Create ZIP for release
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        cd eagle
        zip -r ${{ env.GERBER_DIR }}.zip ${{ env.GERBER_DIR }}

    - name: Release Gerbers (on tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: eagle/${{ env.GERBER_DIR }}.zip
